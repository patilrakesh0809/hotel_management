    /**
     * Format a Date object as YYYY-MM-DD in local time.
     */
    function toISODate(date) {
      const d = new Date(date);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /**
     * Return YYYY-MM-DD offset by `days` from today.
     */
    function offsetDate(days) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    /**
     * Calculate whole nights between two YYYY-MM-DD strings.
     */
    function calculateNights(checkIn, checkOut) {
      if (!checkIn || !checkOut) return 0;
      const start = new Date(`${checkIn}T00:00:00`);
      const end = new Date(`${checkOut}T00:00:00`);
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;
      const diff = Math.round((end - start) / 86400000);
      return diff > 0 ? diff : 0;
    }

        }
        return {
          ...createSeedData(),
          ...parsed,
          settings: { ...createDefaultSettings(), ...(parsed.settings || {}) },
          auditLog: Array.isArray(parsed.auditLog) ? parsed.auditLog : [],
        };
      } catch (err) {
        console.error('Failed to load state from localStorage:', err);
        return createSeedData();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('Failed to persist state:', err);
        showToast('Unable to save changes to browser storage.', 'error');
      }
    }

    /**
     * Append a timestamped entry to the shift handover audit log.
     */
    function logAudit(type, message) {
      if (!Array.isArray(appState.auditLog)) appState.auditLog = [];
      appState.auditLog.unshift({
        id: `log-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        type,
        message,
        timestamp: new Date().toISOString(),
      });
      if (appState.auditLog.length > 40) {
        appState.auditLog = appState.auditLog.slice(0, 40);
      }
    }

    /**
     * Return applicable default GST slab based on room nightly tariff.
     */
    function getDefaultGstForRate(rateINR) {
      const s = appState.settings || createDefaultSettings();
      return Number(rateINR) >= Number(s.gstThresholdINR) ? Number(s.gstHighSlab) : Number(s.gstLowSlab);
    }

    /**
     * Check if a room already has an active or upcoming reservation overlapping [checkIn, checkOut).
     */
    function findOverlappingReservation(roomId, checkIn, checkOut, excludeResId = null) {
      if (!roomId || !checkIn || !checkOut) return null;
      return (
        appState.reservations.find((r) => {
          if (r.roomId !== roomId) return false;
          if (excludeResId && r.id === excludeResId) return false;
          if (r.status !== 'Checked-In' && r.status !== 'Upcoming') return false;
          return checkIn < r.checkOut && checkOut > r.checkIn;
        }) || null
      );
    }

    /**
     * Get the earliest upcoming reservation for a given room.
     */
    function getNextUpcomingReservationForRoom(roomId) {
      const upcoming = appState.reservations
        .filter((r) => r.roomId === roomId && r.status === 'Upcoming')
        .sort((a, b) => a.checkIn.localeCompare(b.checkIn));
      return upcoming[0] || null;
    }

    function formatRelativeTime(isoStr) {
      const diffSec = Math.max(0, Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000));
      if (diffSec < 60) return 'Just now';
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      return `${days}d ago`;
    }

    // =========================================================================
    // 2. CURRENCY & FORMATTING HELPERS
    // =========================================================================
    function getCurrencySymbol() {
      return appState.currency === 'USD' ? '$' : '₹';
    }

    function toDisplayAmount(amountINR) {
      const val = Number(amountINR) || 0;
      if (appState.currency === 'USD') {
        return val / USD_EXCHANGE_RATE;
      }
      return val;
    }

    function fromDisplayAmount(displayVal) {
      const val = Number(displayVal) || 0;
      if (appState.currency === 'USD') {
        return val * USD_EXCHANGE_RATE;
      }
      return val;
    }

    function formatMoney(amountINR, forceDecimals = false) {
      const val = toDisplayAmount(amountINR);
      const isUSD = appState.currency === 'USD';
      const hasFraction = Math.abs(val - Math.round(val)) > 0.005;
      const digits = isUSD || forceDecimals || hasFraction ? 2 : 0;
      const formatted = val.toLocaleString(isUSD ? 'en-US' : 'en-IN', {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits,
      });
      return `${getCurrencySymbol()}${formatted}`;
    }

    function formatDateShort(isoStr) {
      if (!isoStr) return '—';
      const d = new Date(isoStr.includes('T') ? isoStr : `${isoStr}T00:00:00`);
      if (isNaN(d.getTime())) return isoStr;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');

      const styles =
        type === 'error'
          ? { border: 'border-[#FECDD3]', iconBg: 'bg-[#FFF1F2] text-[#E11D48]', icon: 'alert-circle' }
          : type === 'info'
          ? { border: 'border-blue-200', iconBg: 'bg-blue-50 text-[#2563EB]', icon: 'info' }
          : { border: 'border-[#A7F3D0]', iconBg: 'bg-[#ECFDF5] text-[#10B981]', icon: 'check-circle-2' };

      const el = document.createElement('div');
      el.id = id;
      el.className = `flex items-center gap-3 rounded-lg border ${styles.border} bg-[#FFFFFF] px-4 py-3 text-sm text-[#0F172A] shadow-md transition-all duration-150`;
      el.innerHTML = `

          <i data-lucide="${styles.icon}" class="h-4 w-4"></i>
        </div>
        <div class="flex-1 text-xs font-medium leading-snug sm:text-sm">${escapeHTML(message)}</div>
        <button type="button" onclick="document.getElementById('${id}')?.remove()" aria-label="Dismiss notification" class="cursor-pointer rounded p-1 text-[#475569] hover:bg-slate-100">
          <i data-lucide="x" class="h-3.5 w-3.5"></i>
        </button>
      `;
      container.appendChild(el);
      lucide.createIcons({ nodes: [el] });

      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-1');
        setTimeout(() => el.remove(), 180);
      }, 3600);
    }

    function renderAnalyticsAndAuditHTML() {
      // Build 7-day rolling revenue & occupancy metrics
      const days = [];
      for (let i = -6; i <= 0; i++) {
        const iso = offsetDate(i);
        const dateObj = new Date(`${iso}T00:00:00`);
        const label = dateObj.toLocaleDateString('en-GB', { weekday: 'short' });
        const dayNum = dateObj.getDate();

        const dayRevenueINR = appState.bills
          .filter((b) => toISODate(b.issuedAt) === iso)
          .reduce((s, b) => s + (Number(b.grandTotalINR) || 0), 0);

        const dayOccupiedCount = appState.reservations.filter(
          (r) => r.status !== 'Cancelled' && r.checkIn <= iso && r.checkOut > iso
        ).length;

        days.push({ iso, label, dayNum, dayRevenueINR, dayOccupiedCount });
      }

      const maxRev = Math.max(1, ...days.map((d) => d.dayRevenueINR));
      const logIcons = {
        checkin: { icon: 'key-round', cls: 'bg-[#FFF1F2] text-[#E11D48]' },
        checkout: { icon: 'check-circle-2', cls: 'bg-[#ECFDF5] text-[#10B981]' },
        booking: { icon: 'calendar-clock', cls: 'bg-blue-50 text-[#2563EB]' },
        housekeeping: { icon: 'droplets', cls: 'bg-sky-50 text-sky-700' },
        maintenance: { icon: 'wrench', cls: 'bg-[#FFFBEB] text-[#D97706]' },
        cancel: { icon: 'x-circle', cls: 'bg-slate-100 text-[#475569]' },

    function setRoomStatusFilter(status) {
      uiState.roomStatusFilter = status;
      renderApp();

    function setRoomTypeFilter(type) {
      uiState.roomTypeFilter = type;
      renderApp();
    }

    function setRoomSearch(val) {
      uiState.roomSearch = val;
      const container = document.getElementById('room-grid-container');
      if (container) {
        container.innerHTML = renderRoomGridHTML();
        lucide.createIcons({ nodes: [container] });
      }
    }

    function clearRoomFilters() {
      uiState.roomStatusFilter = 'all';
      uiState.roomTypeFilter = 'all';
      uiState.roomSearch = '';
      renderApp();
    }

    function toggleRoomMaintenance(roomId, nextStatus) {
      const room = appState.rooms.find((r) => r.id === roomId);
      if (!room) return;
      if (room.status === 'occupied') {
        showToast('Occupied rooms cannot be switched directly to maintenance.', 'error');
        return;
      }
      room.status = nextStatus;
      logAudit(
        'maintenance',
        nextStatus === 'maintenance'
          ? `Room ${room.number} placed under Maintenance.`
          : `Room ${room.number} returned from Maintenance to Available.`
      );
      saveState();
      renderApp();
      showToast(
        nextStatus === 'maintenance'
          ? `Room ${room.number} marked as Maintenance.`
          : `Room ${room.number} is now Available.`,
        'info'
      );
    }

    function markRoomClean(roomId) {
      const room = appState.rooms.find((r) => r.id === roomId);
      if (!room || room.status !== 'cleaning') return;
      room.status = 'available';
      logAudit('housekeeping', `Housekeeping cleared Room ${room.number} — now Available.`);
      saveState();
      renderApp();
      showToast(`Room ${room.number} marked Clean & Available for check-in.`, 'success');
    }

    function quickCheckoutFromCard(reservationId) {
      const res = appState.reservations.find((r) => r.id === reservationId);
      if (!res) return;
      const gst = getDefaultGstForRate(res.nightlyRateINR);
      const roomCharge = res.nightlyRateINR * res.nights;
      const tax = (roomCharge * gst) / 100;
      const total = roomCharge + tax;
      const advance = Number(res.advanceINR) || 0;
      const balance = Math.max(0, total - advance);

      openConfirmModal({
        title: `Quick Check-Out — Room ${res.roomNumber}`,
        message: `Finalize stay for ${res.guestName} (${res.nights} night${res.nights === 1 ? '' : 's'}) with ${gst}% GST (${formatMoney(total)}, Advance: ${formatMoney(advance)}, Balance Due: ${formatMoney(balance)}) and send Room ${res.roomNumber} to Housekeeping (Cleaning)?`,
        confirmLabel: 'Confirm Check-Out',
        confirmVariant: 'primary',
        onConfirm: () => {
          finalizeReservationCheckout(res.id, {
            addons: [],
            taxPercent: gst,
            discountType: 'flat',
            discountValue: 0,
            paymentMethod: res.paymentMethod || 'UPI',
          });
        },
      });
    }

                Upcoming (${counts.Upcoming})
              </button>
              <button type="button" onclick="setResFilter('Checked-Out')" class="cursor-pointer rounded-lg border px-3 py-1.5 text-xs font-semibold transition-colors duration-150 ${pillClasses(uiState.reservationStatusFilter === 'Checked-Out')}">
                Checked-Out (${counts['Checked-Out']})
              </button>
              <button type="button" onclick="setResFilter('Cancelled')" class="cursor-pointer rounded-lg border px-3 py-1.5 text-xs font-semibold transition-colors duration-150 ${pillClasses(uiState.reservationStatusFilter === 'Cancelled')}">
                Cancelled (${counts.Cancelled})
              </button>
            </div>

            <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center">
              <div class="relative">
                <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[#475569]"></i>
                <input
                  id="res-search-input"
                  type="text"
                  value="${escapeHTML(uiState.reservationSearch)}"
                  oninput="setResSearch(this.value)"
                  placeholder="Search booking ID, guest, room..."
                  class="w-full rounded-lg border border-[#E2E8F0] bg-[#FFFFFF] py-2 pl-9 pr-3 text-xs text-[#0F172A] placeholder:text-slate-400 focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 sm:w-64"
                />

              <button
                type="button"
                onclick="openReservationModal()"
                class="inline-flex cursor-pointer items-center justify-center gap-1.5 rounded-lg bg-[#2563EB] px-3.5 py-2 text-xs font-semibold text-white transition-colors duration-150 hover:bg-[#1D4ED8]"
              >
                <i data-lucide="plus" class="h-4 w-4"></i>
                <span>New Reservation</span>
              </button>
            </div>
          </div>

          <!-- Reservations Table (isolated container so search typing never resets focus) -->
          <div id="reservations-table-container" class="overflow-hidden rounded-xl border border-[#E2E8F0] bg-[#FFFFFF] shadow-sm">
            ${renderReservationsTableHTML()}
          </div>
        </div>
      `;
    }

    function setResFilter(status) {
      uiState.reservationStatusFilter = status;
      renderApp();
    }

    function setResSearch(val) {
      uiState.reservationSearch = val;
      const container = document.getElementById('reservations-table-container');
      if (container) {
        container.innerHTML = renderReservationsTableHTML();
        lucide.createIcons({ nodes: [container] });
      }
    }

    function openReservationModal(preselectedRoomId = '') {

        showToast('All rooms are currently under maintenance.', 'error');
        return;
      }

      const firstAvailable = bookableRooms.find((r) => r.status === 'available');
      const defaultRoomId =
        preselectedRoomId && bookableRooms.some((r) => r.id === preselectedRoomId)
          ? preselectedRoomId
          : firstAvailable
          ? firstAvailable.id
          : bookableRooms[0].id;

      const selectedRoomObj = bookableRooms.find((r) => r.id === defaultRoomId);
      const defaultCheckIn = selectedRoomObj && selectedRoomObj.status === 'available' ? offsetDate(0) : offsetDate(2);
      const defaultCheckOut = selectedRoomObj && selectedRoomObj.status === 'available' ? offsetDate(2) : offsetDate(4);

      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4" role="dialog" aria-modal="true" aria-labelledby="res-modal-title">
          <div class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-xl border border-[#E2E8F0] bg-[#FFFFFF] shadow-xl">

                <h2 id="res-modal-title" class="font-display text-lg font-bold text-[#0F172A]">New Room Reservation</h2>

              <button type="button" onclick="closeModal()" aria-label="Close modal" class="cursor-pointer rounded-lg p-1.5 text-[#475569] hover:bg-slate-100">

              </button>
            </div>

            <form id="reservation-form" class="space-y-4 p-6" novalidate>
              <div id="res-form-error" class="hidden rounded-lg border border-[#FECDD3] bg-[#FFF1F2] px-3.5 py-2.5 text-xs font-medium text-[#E11D48]"></div>

              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div class="sm:col-span-2">
                  <label for="res-guest-name" class="mb-1 block text-xs font-semibold text-[#0F172A]">Guest Full Name <span class="text-[#E11D48]">*</span></label>
                  <input id="res-guest-name" type="text" required placeholder="e.g., Ananya Sharma" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                </div>

                <div>
                  <label for="res-phone" class="mb-1 block text-xs font-semibold text-[#0F172A]">Phone Number <span class="text-[#E11D48]">*</span></label>
                  <input id="res-phone" type="tel" required placeholder="+91 98765 43210" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                </div>

                <div>
                  <label for="res-email" class="mb-1 block text-xs font-semibold text-[#0F172A]">Email Address</label>
                  <input id="res-email" type="email" placeholder="guest@example.com" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                </div>

                <div>
                  <label for="res-gov-id" class="mb-1 block text-xs font-semibold text-[#0F172A]">Gov ID / Passport No. <span class="text-[#E11D48]">*</span></label>
                  <input id="res-gov-id" type="text" required placeholder="Passport / Aadhaar / DL" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                </div>

                <div>
                  <label for="res-guests" class="mb-1 block text-xs font-semibold text-[#0F172A]">Number of Guests</label>
                  <input id="res-guests" type="number" min="1" max="6" value="1" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                </div>

                <div class="sm:col-span-2">
                  <label for="res-room" class="mb-1 block text-xs font-semibold text-[#0F172A]">Select Room <span class="text-[#E11D48]">*</span></label>

                        return `<option value="${r.id}" ${r.id === defaultRoomId ? 'selected' : ''}>Room ${r.number} — ${r.type} · ${formatMoney(r.rateINR)}/night (${statusTag})</option>`;

                  <label for="res-advance" class="mb-1 block text-xs font-semibold text-[#0F172A]">Advance / Security Deposit (${getCurrencySymbol()})</label>

                </div>

                <div>
                  <label for="res-payment-method" class="mb-1 block text-xs font-semibold text-[#0F172A]">Payment Mode</label>
                  <select id="res-payment-method" class="w-full cursor-pointer rounded-lg border border-[#E2E8F0] bg-[#FFFFFF] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20">

                  <textarea id="res-notes" rows="2" placeholder="Optional preferences, late arrival, dietary notes..." class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20"></textarea>
                </div>
              </div>

              <!-- Live Room Estimate & Date-Overlap Conflict Box -->
              <div id="res-estimate-box" class="flex flex-col justify-between gap-2 rounded-lg border border-[#E2E8F0] bg-[#F8FAFC] px-4 py-3 sm:flex-row sm:items-center"></div>

              <div class="flex items-center justify-end gap-2.5 border-t border-[#E2E8F0] pt-4">
                <button type="button" onclick="closeModal()" class="cursor-pointer rounded-lg border border-[#E2E8F0] bg-[#FFFFFF] px-4 py-2 text-sm font-medium text-[#475569] hover:bg-slate-50">
                  Cancel
                </button>
                <button type="submit" id="res-submit-btn" class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg bg-[#2563EB] px-4 py-2 text-sm font-semibold text-white transition-colors duration-150 hover:bg-[#1D4ED8]">
                  <i data-lucide="check" class="h-4 w-4"></i>
                  <span>Confirm Reservation</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      `;

      lucide.createIcons({ nodes: [modalRoot] });
      updateReservationPreview();
      document.getElementById('reservation-form').addEventListener('submit', handleCreateReservation);
    }

    function updateReservationPreview() {
      const box = document.getElementById('res-estimate-box');
      if (!box) return;
      const roomId = document.getElementById('res-room').value;
      const checkIn = document.getElementById('res-checkin').value;
      const checkOut = document.getElementById('res-checkout').value;
      const advDisplay = parseFloat(document.getElementById('res-advance')?.value) || 0;
      const room = appState.rooms.find((r) => r.id === roomId);
      const nights = calculateNights(checkIn, checkOut);
      const todayISO = offsetDate(0);

      if (!room || nights <= 0) {
        box.innerHTML = `<div class="text-xs font-medium text-[#E11D48]">Check-out date must be strictly after check-in date.</div>`;
        return;
      }

      const overlap = findOverlappingReservation(room.id, checkIn, checkOut);
      if (overlap) {
        box.innerHTML = `
          <div class="text-xs font-medium text-[#E11D48]">
            Date conflict: Room ${room.number} is already booked by ${escapeHTML(overlap.guestName)} (${overlap.id}: ${formatDateShort(overlap.checkIn)} &rarr; ${formatDateShort(overlap.checkOut)}).
          </div>
        `;
        return;
      }

      const isFuture = checkIn > todayISO;
      if (!isFuture && room.status !== 'available') {
        box.innerHTML = `
          <div class="text-xs font-medium text-[#E11D48]">
            Room ${room.number} is currently ${room.status}. Choose a future check-in date or mark the room clean & available first.
          </div>
        `;
        return;
      }

      const estimatedINR = room.rateINR * nights;
      const advINR = fromDisplayAmount(Math.max(0, advDisplay));
      const modeBadge = isFuture
        ? `<span class="rounded bg-blue-50 px-1.5 py-0.5 text-[10px] font-semibold text-[#2563EB]">Upcoming Future Booking</span>`
        : `<span class="rounded bg-[#ECFDF5] px-1.5 py-0.5 text-[10px] font-semibold text-[#10B981]">Immediate Check-In</span>`;

      box.innerHTML = `
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-[#0F172A]">Stay Estimate (${nights} night${nights === 1 ? '' : 's'})</span>
            ${modeBadge}
          </div>
          <div class="mt-0.5 text-[11px] text-[#475569]">Room ${room.number} &middot; ${formatMoney(room.rateINR)} &times; ${nights}${advINR > 0 ? ` · Advance: ${formatMoney(advINR)}` : ''}</div>
        </div>
        <div class="font-mono text-lg font-semibold text-[#0F172A] tabular-nums">${formatMoney(estimatedINR)}</div>
      `;
    }

    function handleCreateReservation(e) {
      e.preventDefault();
      const errorBox = document.getElementById('res-form-error');
      const guestName = document.getElementById('res-guest-name').value.trim();
      const phone = document.getElementById('res-phone').value.trim();
      const email = document.getElementById('res-email').value.trim();
      const govId = document.getElementById('res-gov-id').value.trim();
      const guestsCount = Math.max(1, parseInt(document.getElementById('res-guests').value, 10) || 1);
      const roomId = document.getElementById('res-room').value;
      const checkIn = document.getElementById('res-checkin').value;
      const checkOut = document.getElementById('res-checkout').value;
      const advanceDisplay = Math.max(0, parseFloat(document.getElementById('res-advance').value) || 0);
      const paymentMethod = document.getElementById('res-payment-method').value || 'UPI';
      const specialRequests = document.getElementById('res-notes').value.trim();

      const nights = calculateNights(checkIn, checkOut);
      const room = appState.rooms.find((r) => r.id === roomId);
      const todayISO = offsetDate(0);
      const isFuture = checkIn > todayISO;

      if (!guestName || !phone || !govId) {
        errorBox.textContent = 'Please complete all required fields: Guest Name, Phone Number, and Gov ID.';
        errorBox.classList.remove('hidden');
        return;
      }
      if (!room || room.status === 'maintenance') {
        errorBox.textContent = 'Selected room is under maintenance and cannot be booked.';
        errorBox.classList.remove('hidden');
        return;
      }
      if (nights <= 0) {
        errorBox.textContent = 'Check-out date must be at least 1 day after Check-in date.';
        errorBox.classList.remove('hidden');
        return;
      }

      const overlap = findOverlappingReservation(room.id, checkIn, checkOut);
      if (overlap) {
        errorBox.textContent = `Date conflict with ${overlap.id} (${overlap.guestName}: ${overlap.checkIn} to ${overlap.checkOut}). Pick non-overlapping dates.`;
        errorBox.classList.remove('hidden');
        return;
      }

      if (!isFuture && room.status !== 'available') {
        errorBox.textContent = `Room ${room.number} is currently "${room.status}" today. Select a future check-in date or mark the room clean first.`;
        errorBox.classList.remove('hidden');
        return;
      }

      const advanceINR = fromDisplayAmount(advanceDisplay);
      const newRes = {
        id: `RES-${appState.nextResSeq++}`,
        roomId: room.id,
        roomNumber: room.number,
        roomType: room.type,
        nightlyRateINR: room.rateINR,
        guestName,
        phone,
        email: email || '—',
        govId,
        guestsCount,
        checkIn,
        checkOut,
        nights,
        advanceINR,
        paymentMethod,
        specialRequests,
        status: isFuture ? 'Upcoming' : 'Checked-In',
        createdAt: new Date().toISOString(),
      };

      if (!isFuture) {
        room.status = 'occupied';
        logAudit('checkin', `Checked in ${guestName} into Room ${room.number} (${newRes.id})${advanceINR > 0 ? ` with ${formatMoney(advanceINR)} advance` : ''}.`);
      } else {
        logAudit('booking', `Future booking ${newRes.id} created for ${guestName} (Room ${room.number}, ${formatDateShort(checkIn)}).`);
      }

      appState.reservations.unshift(newRes);
      saveState();
      closeModal();
      renderApp();
      showToast(
        isFuture
          ? `Future booking ${newRes.id} confirmed for ${guestName} (Room ${room.number}).`
          : `Room ${room.number} checked in for ${guestName} (${newRes.id}).`,
        'success'
      );
    }

    function checkInUpcomingReservation(reservationId) {
      const res = appState.reservations.find((r) => r.id === reservationId);
      if (!res || res.status !== 'Upcoming') return;
      const room = appState.rooms.find((r) => r.id === res.roomId);
      if (!room || room.status !== 'available') {
        showToast(`Room ${res.roomNumber} must be Clean & Available before checking in ${res.guestName}.`, 'error');
        return;
      }
      res.status = 'Checked-In';
      room.status = 'occupied';
      logAudit('checkin', `Checked in upcoming guest ${res.guestName} into Room ${room.number} (${res.id}).`);
      saveState();
      renderApp();
      showToast(`${res.guestName} checked into Room ${room.number}.`, 'success');
    }

    function confirmCancelReservation(reservationId) {
      const res = appState.reservations.find((r) => r.id === reservationId);
      if (!res) return;
      const wasCheckedIn = res.status === 'Checked-In';
      openConfirmModal({
        title: `Cancel Reservation ${res.id}?`,
        message: wasCheckedIn
          ? `Cancelling ${res.guestName}'s active stay will free Room ${res.roomNumber} back to Available.`
          : `Cancel upcoming booking ${res.id} for ${res.guestName} (Room ${res.roomNumber})?`,
        confirmLabel: 'Cancel Reservation',
        confirmVariant: 'danger',
        onConfirm: () => {
          res.status = 'Cancelled';
          if (wasCheckedIn) {
            const room = appState.rooms.find((r) => r.id === res.roomId);
            if (room) room.status = 'available';
          }
          if (uiState.billing.selectedReservationId === res.id) {
            uiState.billing.selectedReservationId = null;
          }
          logAudit('cancel', `Cancelled reservation ${res.id} for ${res.guestName} (Room ${res.roomNumber}).`);
          saveState();
          renderApp();
          showToast(`Reservation ${res.id} cancelled.`, 'info');
        },
      });
    }

    // =========================================================================
    // 7. VIEW 3: BILL CALCULATOR & CHECKOUT INVOICE
    // =========================================================================
    function openBillingForReservation(reservationId) {
      const res = appState.reservations.find((r) => r.id === reservationId);
      uiState.billing.mode = 'reservation';
      uiState.billing.selectedReservationId = reservationId;
      uiState.billing.addons = [];
      uiState.billing.taxPercent = res ? getDefaultGstForRate(res.nightlyRateINR) : appState.settings.gstLowSlab;
      uiState.billing.paymentMethod = (res && res.paymentMethod) || 'UPI';
      uiState.billing.discountType = 'percent';
      uiState.billing.discountValue = 0;
      switchView('billing');
    }

    function computeCurrentBill() {
      const b = uiState.billing;
      const parsedQuickNights = b.quickNights === '' ? 0 : Math.max(0, parseInt(b.quickNights, 10) || 0);
      const parsedQuickRateINR = b.quickRateINR === '' ? 0 : Math.max(0, Number(b.quickRateINR) || 0);
      const parsedQuickAdvanceINR = b.quickAdvanceINR === '' ? 0 : Math.max(0, Number(b.quickAdvanceINR) || 0);

      let base = {
        isReservation: false,
        reservation: null,
        guestName: b.quickGuestName || 'Walk-In Guest',
        phone: '—',
        email: '—',
        roomNumber: 'Quick Calc',
        roomType: b.quickRoomType,
        checkIn: offsetDate(0),
        checkOut: offsetDate(Math.max(1, parsedQuickNights)),
        nights: parsedQuickNights,
        nightlyRateINR: parsedQuickRateINR,
        advancePaidINR: parsedQuickAdvanceINR,
      };

      if (b.mode === 'reservation') {
        const activeList = appState.reservations.filter((r) => r.status === 'Checked-In');
        let res = activeList.find((r) => r.id === b.selectedReservationId) || activeList[0] || null;
        if (res) {
          b.selectedReservationId = res.id;
          base = {
            isReservation: true,
            reservation: res,
            guestName: res.guestName,
            phone: res.phone,
            email: res.email,
            roomNumber: res.roomNumber,
            roomType: res.roomType,
            checkIn: res.checkIn,
            checkOut: res.checkOut,
            nights: res.nights,
            nightlyRateINR: res.nightlyRateINR,
            advancePaidINR: Number(res.advanceINR) || 0,
          };
        }
      }

      const roomChargeINR = base.nightlyRateINR * base.nights;
      const addonsTotalINR = b.addons.reduce((sum, item) => sum + (Number(item.amountINR) || 0), 0);
      const subtotalINR = roomChargeINR + addonsTotalINR;

      let discountAmountINR = 0;
      const rawDisc = b.discountValue === '' ? 0 : Math.max(0, parseFloat(b.discountValue) || 0);
      if (b.discountType === 'percent') {
        const clampedPct = Math.min(100, rawDisc);
        discountAmountINR = (subtotalINR * clampedPct) / 100;
      } else {
        discountAmountINR = Math.min(subtotalINR, fromDisplayAmount(rawDisc));
      }

      const taxableINR = Math.max(0, subtotalINR - discountAmountINR);
      const taxPct = b.taxPercent === '' ? 0 : Math.max(0, parseFloat(b.taxPercent) || 0);
      const taxAmountINR = (taxableINR * taxPct) / 100;
      const grandTotalINR = taxableINR + taxAmountINR;
      const balanceDueINR = Math.max(0, grandTotalINR - base.advancePaidINR);

      return {
        ...base,
        roomChargeINR,
        addons: b.addons,
        addonsTotalINR,
        subtotalINR,
        discountType: b.discountType,
        discountValue: rawDisc,
        discountAmountINR,
        taxPercent: taxPct,
        taxAmountINR,
        grandTotalINR,
        balanceDueINR,
        paymentMethod: b.paymentMethod || 'UPI',
      };
    }

    function renderAddonsListHTML() {
      const b = uiState.billing;
      if (b.addons.length === 0) {
        return `<div class="rounded-lg border border-dashed border-[#E2E8F0] py-4 text-center text-xs text-[#475569]">No extra add-on charges added yet.</div>`;
      }
      return `
        <ul class="divide-y divide-[#E2E8F0] rounded-lg border border-[#E2E8F0]">
          ${b.addons
            .map(
              (item) => `
                <li class="flex items-center justify-between px-3.5 py-2.5 text-xs">
                  <span class="font-medium text-[#0F172A]">${escapeHTML(item.label)}</span>
                  <div class="flex items-center gap-3">
                    <span class="font-mono font-semibold text-[#0F172A] tabular-nums">${formatMoney(item.amountINR)}</span>
                    <button type="button" onclick="removeAddon('${item.id}')" aria-label="Remove item" class="cursor-pointer rounded p-1 text-[#475569] hover:bg-[#FFF1F2] hover:text-[#E11D48]">
                      <i data-lucide="trash-2" class="h-3.5 w-3.5"></i>
                    </button>
                  </div>
                </li>
              `
            )
            .join('')}
        </ul>
      `;
    }

    function updateBillPreview() {
      const container = document.getElementById('live-invoice-preview-container');
      if (container) {
        container.innerHTML = renderLiveInvoicePreviewHTML();
        lucide.createIcons({ nodes: [container] });
      }
    }

    function updateAddonsList() {
      const container = document.getElementById('addons-list-container');
      if (container) {
        container.innerHTML = renderAddonsListHTML();
        lucide.createIcons({ nodes: [container] });
      }
    }

    function renderBillingView() {

        b.mode = 'quick';

      const calc = computeCurrentBill();
      const quickRateDisplay =
        b.quickRateINR === '' ? '' : Number(toDisplayAmount(b.quickRateINR).toFixed(2));

        b.quickAdvanceINR === '' ? '' : Number(toDisplayAmount(b.quickAdvanceINR).toFixed(2));

      return `
        <div class="grid grid-cols-1 gap-6 xl:grid-cols-12">

          <div class="space-y-5 xl:col-span-7">

            <section class="rounded-xl border border-[#E2E8F0] bg-[#FFFFFF] p-5 shadow-sm">
              <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center">

                  <h2 class="font-display text-base font-bold text-[#0F172A]">Billing Source</h2>

                  <button
                    type="button"
                    onclick="setBillingMode('quick')"
                    class="cursor-pointer rounded-md px-3 py-1.5 text-xs font-semibold transition-colors duration-150 ${
                      b.mode === 'quick' ? 'bg-[#2563EB] text-white' : 'text-[#475569] hover:text-[#0F172A]'

                    Quick Calculator

                  b.mode === 'reservation'
                    ? activeReservations.length === 0

                            .map(
                              (r) =>
                                `<option value="${r.id}" ${calc.reservation && calc.reservation.id === r.id ? 'selected' : ''}>Room ${r.roomNumber} — ${escapeHTML(r.guestName)} (${r.id} · ${r.nights} night${r.nights > 1 ? 's' : ''})</option>`
                            )
                            .join('')}
                        </select>
                      `
                    : `
                      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                        <div class="sm:col-span-2">
                          <label for="quick-guest" class="mb-1 block text-xs font-semibold text-[#0F172A]">Guest / Reference Name</label>
                          <input id="quick-guest" type="text" value="${escapeHTML(b.quickGuestName)}" oninput="updateQuickField('quickGuestName', this.value)" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                        </div>
                        <div>
                          <label for="quick-type" class="mb-1 block text-xs font-semibold text-[#0F172A]">Room Category</label>
                          <select id="quick-type" onchange="updateQuickRoomType(this.value)" class="w-full cursor-pointer rounded-lg border border-[#E2E8F0] bg-[#FFFFFF] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20">
                            ${ROOM_TYPES.map((rt) => `<option value="${rt.type}" ${b.quickRoomType === rt.type ? 'selected' : ''}>${rt.type}</option>`).join('')}
                          </select>
                        </div>
                        <div>
                          <label for="quick-rate" class="mb-1 block text-xs font-semibold text-[#0F172A]">Nightly Rate (${getCurrencySymbol()})</label>
                          <input id="quick-rate" type="number" min="0" step="any" value="${quickRateDisplay}" oninput="updateQuickRate(this.value)" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                        </div>
                        <div>
                          <label for="quick-nights" class="mb-1 block text-xs font-semibold text-[#0F172A]">Nights</label>
                          <input id="quick-nights" type="number" min="1" max="90" value="${b.quickNights}" oninput="updateQuickField('quickNights', this.value)" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                        </div>
                        <div>
                          <label for="quick-advance" class="mb-1 block text-xs font-semibold text-[#0F172A]">Advance Paid (${getCurrencySymbol()})</label>
                          <input id="quick-advance" type="number" min="0" step="any" value="${quickAdvDisplay}" oninput="updateQuickAdvance(this.value)" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                        </div>
                      </div>
                    `
                }
              </div>
            </section>

            <!-- Itemized Add-On Charges -->
            <section class="rounded-xl border border-[#E2E8F0] bg-[#FFFFFF] p-5 shadow-sm">
              <h2 class="font-display text-base font-bold text-[#0F172A]">Itemized Add-On Charges</h2>
              <p class="mt-0.5 text-xs text-[#475569]">Quick-add common hotel services or enter a custom line item.</p>

              <!-- Quick Preset Buttons -->
              <div class="mt-3 flex flex-wrap gap-2">
                ${ADDON_PRESETS.map(
                  (preset, idx) => `
                    <button
                      type="button"
                      onclick="addPresetAddon(${idx})"
                      class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg border border-[#E2E8F0] bg-[#F8FAFC] px-2.5 py-1.5 text-xs font-medium text-[#0F172A] transition-colors duration-150 hover:border-[#2563EB] hover:bg-blue-50/50 hover:text-[#2563EB]"
                    >
                      <i data-lucide="plus" class="h-3 w-3"></i>
                      <span>${escapeHTML(preset.label)}</span>
                      <span class="font-mono text-[11px] text-[#475569] tabular-nums">(${formatMoney(preset.amountINR)})</span>
                    </button>
                  `
                ).join('')}
              </div>

              <!-- Custom Add-On Form -->
              <div class="mt-4 flex flex-col gap-2 sm:flex-row">
                <input
                  id="custom-addon-label"
                  type="text"
                  placeholder="Custom item (e.g., Spa, Late Checkout)"
                  class="flex-1 rounded-lg border border-[#E2E8F0] px-3 py-2 text-xs text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20"
                />
                <input
                  id="custom-addon-amount"
                  type="number"
                  min="1"
                  step="any"
                  placeholder="Amount (${getCurrencySymbol()})"
                  class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-xs text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 sm:w-36"
                />
                <button
                  type="button"
                  onclick="addCustomAddon()"
                  class="inline-flex cursor-pointer items-center justify-center gap-1.5 rounded-lg bg-[#0F172A] px-3.5 py-2 text-xs font-semibold text-white transition-colors duration-150 hover:bg-slate-800"
                >
                  <i data-lucide="plus-circle" class="h-3.5 w-3.5"></i>
                  <span>Add</span>
                </button>
              </div>

              <!-- Current Add-Ons List (isolated container) -->
              <div id="addons-list-container" class="mt-4">${renderAddonsListHTML()}</div>
            </section>

            <!-- Tax, Discount & Payment Controls -->
            <section class="rounded-xl border border-[#E2E8F0] bg-[#FFFFFF] p-5 shadow-sm">
              <h2 class="font-display text-base font-bold text-[#0F172A]">Tax, Discount & Payment Mode</h2>
              <div class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-3">
                <div>
                  <label for="bill-tax-input" class="mb-1 block text-xs font-semibold text-[#0F172A]">Tax / GST (%)</label>
                  <input
                    id="bill-tax-input"
                    type="number"
                    min="0"
                    max="50"
                    step="any"
                    value="${b.taxPercent}"
                    oninput="updateBillingTax(this.value)"
                    class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20"
                  />
                </div>
                <div>
                  <div class="mb-1 flex items-center justify-between">
                    <label for="bill-discount-input" class="text-xs font-semibold text-[#0F172A]">Discount</label>
                    <div class="inline-flex rounded-md border border-[#E2E8F0] bg-[#F8FAFC] p-0.5 text-[11px] font-semibold">
                      <button id="btn-disc-percent" type="button" onclick="setDiscountType('percent')" class="cursor-pointer rounded px-2 py-0.5 ${b.discountType === 'percent' ? 'bg-[#2563EB] text-white' : 'text-[#475569]'}">%</button>
                      <button id="btn-disc-flat" type="button" onclick="setDiscountType('flat')" class="cursor-pointer rounded px-2 py-0.5 ${b.discountType === 'flat' ? 'bg-[#2563EB] text-white' : 'text-[#475569]'}">${getCurrencySymbol()}</button>
                    </div>
                  </div>
                  <input
                    id="bill-discount-input"
                    type="number"
                    min="0"
                    step="any"
                    value="${b.discountValue}"
                    oninput="updateBillingDiscount(this.value)"
                    class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20"
                  />
                </div>
                <div>
                  <label for="bill-payment-method" class="mb-1 block text-xs font-semibold text-[#0F172A]">Settlement Mode</label>
                  <select
                    id="bill-payment-method"
                    onchange="updateBillingPaymentMethod(this.value)"
                    class="w-full cursor-pointer rounded-lg border border-[#E2E8F0] bg-[#FFFFFF] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20"
                  >
                    ${PAYMENT_METHODS.map((pm) => `<option value="${pm}" ${b.paymentMethod === pm ? 'selected' : ''}>${pm}</option>`).join('')}
                  </select>
                </div>
              </div>
            </section>
          </div>

          <!-- Right Column: Live Swiss-Minimalist Invoice Summary (isolated for non-destructive live updates) -->
          <div id="live-invoice-preview-container" class="xl:col-span-5">
            ${renderLiveInvoicePreviewHTML()}
          </div>
        </div>
      `;
    }

    function setBillingMode(mode) {
      uiState.billing.mode = mode;
      renderApp();
    }

    function selectBillingReservation(resId) {
      uiState.billing.selectedReservationId = resId;
      const res = appState.reservations.find((r) => r.id === resId);
      if (res) {
        const autoGst = getDefaultGstForRate(res.nightlyRateINR);
        uiState.billing.taxPercent = autoGst;
        uiState.billing.paymentMethod = res.paymentMethod || 'UPI';
        const taxInput = document.getElementById('bill-tax-input');
        const pmSelect = document.getElementById('bill-payment-method');
        if (taxInput) taxInput.value = autoGst;
        if (pmSelect) pmSelect.value = uiState.billing.paymentMethod;
      }
      updateBillPreview();
    }

    function updateQuickRoomType(type) {
      uiState.billing.quickRoomType = type;
      const found = ROOM_TYPES.find((r) => r.type === type);
      if (found) {
        uiState.billing.quickRateINR = found.defaultRateINR;
        const autoGst = getDefaultGstForRate(found.defaultRateINR);
        uiState.billing.taxPercent = autoGst;
        const rateInput = document.getElementById('quick-rate');
        const taxInput = document.getElementById('bill-tax-input');
        if (rateInput) {
          rateInput.value = Number(toDisplayAmount(found.defaultRateINR).toFixed(2));
        }
        if (taxInput) taxInput.value = autoGst;
      }
      updateBillPreview();
    }

    function updateQuickRate(val) {
      uiState.billing.quickRateINR = val === '' ? '' : fromDisplayAmount(val);
      updateBillPreview();
    }

    function updateQuickAdvance(val) {
      uiState.billing.quickAdvanceINR = val === '' ? '' : fromDisplayAmount(val);
      updateBillPreview();
    }

    function updateQuickField(field, val) {
      uiState.billing[field] = val;
      updateBillPreview();
    }

    function updateBillingPaymentMethod(val) {
      uiState.billing.paymentMethod = val;
      updateBillPreview();
    }

    function addPresetAddon(index) {
      const preset = ADDON_PRESETS[index];
      if (!preset) return;
      uiState.billing.addons.push({
        id: `addon-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        label: preset.label,
        amountINR: preset.amountINR,
      });
      updateAddonsList();
      updateBillPreview();
    }

    function addCustomAddon() {
      const labelEl = document.getElementById('custom-addon-label');
      const amtEl = document.getElementById('custom-addon-amount');
      const label = labelEl.value.trim();
      const displayAmt = parseFloat(amtEl.value);

      if (!label || isNaN(displayAmt) || displayAmt <= 0) {
        showToast('Enter a valid add-on description and positive amount.', 'error');
        return;
      }

      uiState.billing.addons.push({
        id: `addon-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        label,
        amountINR: fromDisplayAmount(displayAmt),
      });
      labelEl.value = '';
      amtEl.value = '';
      updateAddonsList();
      updateBillPreview();
    }

    function removeAddon(addonId) {
      uiState.billing.addons = uiState.billing.addons.filter((a) => a.id !== addonId);
      updateAddonsList();
      updateBillPreview();
    }

    function updateBillingTax(val) {
      uiState.billing.taxPercent = val === '' ? '' : val;
      updateBillPreview();
    }

    function setDiscountType(type) {
      uiState.billing.discountType = type;
      const pctBtn = document.getElementById('btn-disc-percent');
      const flatBtn = document.getElementById('btn-disc-flat');
      if (pctBtn && flatBtn) {
        pctBtn.className = `cursor-pointer rounded px-2 py-0.5 ${type === 'percent' ? 'bg-[#2563EB] text-white' : 'text-[#475569]'}`;
        flatBtn.className = `cursor-pointer rounded px-2 py-0.5 ${type === 'flat' ? 'bg-[#2563EB] text-white' : 'text-[#475569]'}`;
      }
      updateBillPreview();
    }

    function updateBillingDiscount(val) {
      uiState.billing.discountValue = val === '' ? '' : val;
      updateBillPreview();
    }

    function finalizeReservationCheckout(reservationId, options) {
      const res = appState.reservations.find((r) => r.id === reservationId);
      if (!res || res.status !== 'Checked-In') {
        showToast('Reservation is not currently checked in.', 'error');
        return;
      }

      const roomChargeINR = res.nightlyRateINR * res.nights;
      const addons = options.addons || [];
      const addonsTotalINR = addons.reduce((s, a) => s + (Number(a.amountINR) || 0), 0);
      const subtotalINR = roomChargeINR + addonsTotalINR;

      let discountAmountINR = 0;
      const dVal = Math.max(0, Number(options.discountValue) || 0);
      if (options.discountType === 'percent') {
        discountAmountINR = (subtotalINR * Math.min(100, dVal)) / 100;
      } else {
        discountAmountINR = Math.min(subtotalINR, fromDisplayAmount(dVal));
      }

      const taxable = Math.max(0, subtotalINR - discountAmountINR);
      const taxPercent = Math.max(0, Number(options.taxPercent) || 0);
      const taxAmountINR = (taxable * taxPercent) / 100;
      const grandTotalINR = taxable + taxAmountINR;
      const advancePaidINR = Number(res.advanceINR) || 0;
      const balanceDueINR = Math.max(0, grandTotalINR - advancePaidINR);
      const paymentMethod = options.paymentMethod || res.paymentMethod || 'UPI';

      const invoice = {
        invoiceId: `INV-2026-${appState.nextInvSeq++}`,
        reservationId: res.id,
        guestName: res.guestName,
        phone: res.phone,
        email: res.email,
        roomNumber: res.roomNumber,
        roomType: res.roomType,
        checkIn: res.checkIn,
        checkOut: res.checkOut,
        nights: res.nights,
        nightlyRateINR: res.nightlyRateINR,
        roomChargeINR,
        addons: addons.map((a) => ({ ...a })),
        addonsTotalINR,
        subtotalINR,
        discountType: options.discountType,
        discountValue: dVal,
        discountAmountINR,
        taxPercent,
        taxAmountINR,
        grandTotalINR,
        advancePaidINR,
        balanceDueINR,
        paymentMethod,
        issuedAt: new Date().toISOString(),
      };

      res.status = 'Checked-Out';
      const room = appState.rooms.find((r) => r.id === res.roomId);
      if (room) room.status = 'cleaning';

      appState.bills.unshift(invoice);
      uiState.billing.addons = [];
      uiState.billing.discountValue = 0;
      uiState.billing.selectedReservationId = null;

      logAudit('checkout', `Checked out ${res.guestName} (Room ${res.roomNumber}) — ${invoice.invoiceId} settled via ${paymentMethod}; Room sent to Cleaning.`);
      saveState();
      renderApp();
      showToast(`Checked out ${res.guestName}. Room ${res.roomNumber} marked Cleaning & ${invoice.invoiceId} saved.`, 'success');
    }

    // =========================================================================
    // 10. FILE DOWNLOAD & IMPORT UTILITIES (CSV, JSON, TXT)
    // =========================================================================
    function downloadBlob(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function csvEscape(val) {
      const str = String(val ?? '');
      if (/[",\n\r]/.test(str)) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    function exportRecordsCSV() {
      const headers = [
        'Invoice ID',
        'Reservation ID',
        'Guest Name',
        'Room Number',
        'Room Type',
        'Check-In',
        'Check-Out',
        'Nights',
        `Room Charge (${appState.currency})`,
        `Add-Ons (${appState.currency})`,
        `Discount (${appState.currency})`,
        'Tax %',
        `Tax Amount (${appState.currency})`,
        `Grand Total (${appState.currency})`,
        `Advance Paid (${appState.currency})`,
        `Balance Due (${appState.currency})`,
        'Payment Method',
        'Issued Date',
      ];

      const rows = appState.bills.map((b) => {
        const adv = Number(b.advancePaidINR) || 0;
        const bal = b.balanceDueINR !== undefined ? Number(b.balanceDueINR) : Math.max(0, Number(b.grandTotalINR) - adv);
        return [
          b.invoiceId,
          b.reservationId,
          b.guestName,
          b.roomNumber,
          b.roomType,
          b.checkIn,
          b.checkOut,
          b.nights,
          toDisplayAmount(b.roomChargeINR).toFixed(2),
          toDisplayAmount(b.addonsTotalINR).toFixed(2),
          toDisplayAmount(b.discountAmountINR).toFixed(2),
          b.taxPercent,
          toDisplayAmount(b.taxAmountINR).toFixed(2),
          toDisplayAmount(b.grandTotalINR).toFixed(2),
          toDisplayAmount(adv).toFixed(2),
          toDisplayAmount(bal).toFixed(2),
          b.paymentMethod || 'UPI',
          b.issuedAt,
        ];
      });

      const csvContent = [headers, ...rows].map((row) => row.map(csvEscape).join(',')).join('\r\n');
      const stamp = toISODate(new Date());
      downloadBlob(csvContent, `swiss-frontdesk-records-${stamp}.csv`, 'text/csv;charset=utf-8;');
      showToast('Exported Excel-compatible CSV ledger.', 'success');
    }

    function exportRecordsJSON() {
      const payload = {
        exportedAt: new Date().toISOString(),
        application: 'Swiss Front-Desk Hotel Management',
        data: appState,
      };
      const stamp = toISODate(new Date());
      downloadBlob(JSON.stringify(payload, null, 2), `swiss-frontdesk-backup-${stamp}.json`, 'application/json;charset=utf-8;');
      showToast('Exported complete JSON database backup.', 'success');
    }

    function exportRecordsTXT() {
      const s = appState.settings || createDefaultSettings();
      const available = appState.rooms.filter((r) => r.status === 'available').length;
      const occupied = appState.rooms.filter((r) => r.status === 'occupied').length;
      const cleaning = appState.rooms.filter((r) => r.status === 'cleaning').length;
      const maintenance = appState.rooms.filter((r) => r.status === 'maintenance').length;
      const totalRevenueINR = appState.bills.reduce((sum, b) => sum + (Number(b.grandTotalINR) || 0), 0);

      const lines = [
        '====================================================================',
        `   ${s.hotelName.toUpperCase()} — HOTEL SUMMARY REPORT`,
        `   ${s.address} | GSTIN: ${s.gstin}`,
        '====================================================================',
        `Generated On  : ${new Date().toLocaleString()}`,
        `Currency      : ${appState.currency}`,
        '--------------------------------------------------------------------',
        '1. ROOM OCCUPANCY SNAPSHOT (10 ROOMS)',
        `   - Available (Empty) : ${available}`,
        `   - Occupied          : ${occupied}`,
        `   - Cleaning / Dirty  : ${cleaning}`,
        `   - Maintenance       : ${maintenance}`,
        '',
        ...appState.rooms.map((r) => {
          const active = getActiveReservationForRoom(r.id);
          const guestInfo = active ? ` | Guest: ${active.guestName} (Out: ${active.checkOut})` : '';
          return `   Room ${r.number} | ${r.type.padEnd(16)} | ${r.status.toUpperCase().padEnd(11)} | ${formatMoney(r.rateINR)}/night${guestInfo}`;
        }),
        '',
        '--------------------------------------------------------------------',
        `2. FINALIZED BILLING RECORDS (${appState.bills.length} INVOICES)`,
        `   Total Collected Revenue: ${formatMoney(totalRevenueINR, true)}`,
        '',
        ...appState.bills.map((b) => {
          const extras = (b.addons || []).map((a) => `${a.label} (${formatMoney(a.amountINR)})`).join(', ') || 'None';
          const adv = Number(b.advancePaidINR) || 0;
          const bal = b.balanceDueINR !== undefined ? Number(b.balanceDueINR) : Math.max(0, Number(b.grandTotalINR) - adv);
          return [
            `   [${b.invoiceId}] ${b.guestName} — Room ${b.roomNumber} (${b.nights} nights) | Mode: ${b.paymentMethod || 'UPI'}`,
            `     Stay: ${b.checkIn} to ${b.checkOut} | Extras: ${extras}`,
            `     Subtotal: ${formatMoney(b.subtotalINR)} | Tax (${b.taxPercent}%): ${formatMoney(b.taxAmountINR)} | TOTAL: ${formatMoney(b.grandTotalINR, true)} | Adv: ${formatMoney(adv)} | Bal: ${formatMoney(bal, true)}`,
          ].join('\n');
        }),
        '====================================================================',
      ];

      const stamp = toISODate(new Date());
      downloadBlob(lines.join('\n'), `swiss-frontdesk-report-${stamp}.txt`, 'text/plain;charset=utf-8;');
      showToast('Exported formatted TXT summary report.', 'success');
    }

    function handleImportJSON(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const imported = parsed.data ? parsed.data : parsed;
          if (
            !imported ||
            !Array.isArray(imported.rooms) ||
            !Array.isArray(imported.reservations) ||
            !Array.isArray(imported.bills)
          ) {
            throw new Error('Invalid hotel backup schema.');
          }
          appState = {
            currency: imported.currency === 'USD' ? 'USD' : 'INR',
            settings: { ...createDefaultSettings(), ...(imported.settings || {}) },
            rooms: imported.rooms,
            reservations: imported.reservations,
            bills: imported.bills,
            auditLog: Array.isArray(imported.auditLog) ? imported.auditLog : [],
            nextResSeq: Number(imported.nextResSeq) || 2000,
            nextInvSeq: Number(imported.nextInvSeq) || 2000,
          };
          saveState();
          renderApp();
          showToast(`Successfully imported ${appState.bills.length} invoices and ${appState.reservations.length} reservations.`, 'success');
        } catch (err) {
          console.error(err);
          showToast('Import failed: Please select a valid Swiss Front-Desk JSON backup file.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // 10B. EDITABLE ROOM RATES & PROPERTY SETTINGS MODAL
    // =========================================================================
    function openSettingsModal() {
      const s = appState.settings || createDefaultSettings();
      const thresholdDisplay = Number(toDisplayAmount(s.gstThresholdINR).toFixed(2));

      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-4" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
          <div class="max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-xl border border-[#E2E8F0] bg-[#FFFFFF] shadow-xl">
            <div class="flex items-center justify-between border-b border-[#E2E8F0] px-6 py-4">
              <div>
                <h2 id="settings-modal-title" class="font-display text-lg font-bold text-[#0F172A]">Property & Tariff Settings</h2>
                <p class="text-xs text-[#475569]">Customize hotel branding, GST slabs, and individual room nightly rates.</p>
              </div>
              <button type="button" onclick="closeModal()" aria-label="Close modal" class="cursor-pointer rounded-lg p-1.5 text-[#475569] hover:bg-slate-100">
                <i data-lucide="x" class="h-5 w-5"></i>
              </button>
            </div>

            <form id="settings-form" class="space-y-6 p-6">
              <!-- Hotel Identity -->
              <div class="space-y-3">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-[#475569]">Property Identity (Invoices & Reports)</h3>
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                  <div class="sm:col-span-2">
                    <label for="set-hotel-name" class="mb-1 block text-xs font-semibold text-[#0F172A]">Hotel Name</label>
                    <input id="set-hotel-name" type="text" required value="${escapeHTML(s.hotelName)}" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                  </div>
                  <div>
                    <label for="set-address" class="mb-1 block text-xs font-semibold text-[#0F172A]">Address</label>
                    <input id="set-address" type="text" value="${escapeHTML(s.address)}" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                  </div>
                  <div>
                    <label for="set-gstin" class="mb-1 block text-xs font-semibold text-[#0F172A]">GSTIN / Tax ID</label>
                    <input id="set-gstin" type="text" value="${escapeHTML(s.gstin)}" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                  </div>
                </div>
              </div>

              <!-- GST Slabs -->
              <div class="space-y-3 border-t border-[#E2E8F0] pt-5">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-[#475569]">Automatic GST Tariff Slabs</h3>
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                  <div>
                    <label for="set-gst-low" class="mb-1 block text-xs font-semibold text-[#0F172A]">Standard Slab (%)</label>
                    <input id="set-gst-low" type="number" min="0" max="50" step="any" value="${s.gstLowSlab}" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                  </div>
                  <div>
                    <label for="set-gst-high" class="mb-1 block text-xs font-semibold text-[#0F172A]">Luxury Slab (%)</label>
                    <input id="set-gst-high" type="number" min="0" max="50" step="any" value="${s.gstHighSlab}" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                  </div>
                  <div>
                    <label for="set-gst-threshold" class="mb-1 block text-xs font-semibold text-[#0F172A]">Luxury Threshold (${getCurrencySymbol()})</label>
                    <input id="set-gst-threshold" type="number" min="0" step="any" value="${thresholdDisplay}" class="w-full rounded-lg border border-[#E2E8F0] px-3 py-2 font-mono text-sm text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20" />
                  </div>
                </div>
              </div>

              <!-- Editable Per-Room Nightly Rates -->
              <div class="space-y-3 border-t border-[#E2E8F0] pt-5">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-[#475569]">Room Nightly Rates (${getCurrencySymbol()})</h3>
                <div class="grid grid-cols-1 gap-2.5 sm:grid-cols-2">
                  ${appState.rooms
                    .map((r) => {
                      const rateDisp = Number(toDisplayAmount(r.rateINR).toFixed(2));
                      return `
                        <div class="flex items-center justify-between gap-2 rounded-lg border border-[#E2E8F0] bg-[#F8FAFC] px-3 py-2">
                          <div>
                            <div class="font-mono text-xs font-semibold text-[#0F172A]">Room ${r.number}</div>
                            <div class="text-[11px] text-[#475569]">${escapeHTML(r.type)}</div>
                          </div>
                          <input
                            data-room-rate-id="${r.id}"
                            type="number"
                            min="1"
                            step="any"
                            value="${rateDisp}"
                            class="w-28 rounded-md border border-[#E2E8F0] bg-[#FFFFFF] px-2.5 py-1.5 text-right font-mono text-xs font-semibold text-[#0F172A] focus:border-[#2563EB] focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20"
                          />
                        </div>
                      `;
                    })
                    .join('')}
                </div>
              </div>

              <div class="flex items-center justify-end gap-2.5 border-t border-[#E2E8F0] pt-4">
                <button type="button" onclick="closeModal()" class="cursor-pointer rounded-lg border border-[#E2E8F0] bg-[#FFFFFF] px-4 py-2 text-sm font-medium text-[#475569] hover:bg-slate-50">
                  Cancel
                </button>
                <button type="submit" class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg bg-[#2563EB] px-4 py-2 text-sm font-semibold text-white transition-colors duration-150 hover:bg-[#1D4ED8]">
                  <i data-lucide="save" class="h-4 w-4"></i>
                  <span>Save Settings</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
      lucide.createIcons({ nodes: [modalRoot] });
      document.getElementById('settings-form').addEventListener('submit', handleSaveSettings);
    }

    function handleSaveSettings(e) {
      e.preventDefault();
      const hotelName = document.getElementById('set-hotel-name').value.trim() || 'Swiss Front-Desk Hotel';
      const address = document.getElementById('set-address').value.trim();
      const gstin = document.getElementById('set-gstin').value.trim();
      const gstLowSlab = Math.max(0, parseFloat(document.getElementById('set-gst-low').value) || 0);
      const gstHighSlab = Math.max(0, parseFloat(document.getElementById('set-gst-high').value) || 0);
      const thresholdDisplay = Math.max(0, parseFloat(document.getElementById('set-gst-threshold').value) || 0);

      appState.settings = {
        hotelName,
        address,
        gstin,
        gstLowSlab,
        gstHighSlab,
        gstThresholdINR: fromDisplayAmount(thresholdDisplay),
      };

      document.querySelectorAll('[data-room-rate-id]').forEach((input) => {
        const roomId = input.getAttribute('data-room-rate-id');
        const val = parseFloat(input.value);
        const room = appState.rooms.find((r) => r.id === roomId);
        if (room && !isNaN(val) && val > 0) {
          room.rateINR = fromDisplayAmount(val);
        }
      });

      logAudit('settings', `Updated property settings & room tariffs (${hotelName}, GST ${gstLowSlab}% / ${gstHighSlab}%).`);
      saveState();
      closeModal();
      renderApp();
      showToast('Property settings and room rates saved.', 'success');
    }

    // =========================================================================
    // 11. MASTER RENDER PIPELINE
    // =========================================================================
    const VIEW_META = {
      overview: {
        title: 'Room Overview',
        subtitle: 'Real-time 10-room occupancy grid & empty room checker',
      },
      reservations: {
        title: 'Reservations Manager',
        subtitle: 'Manage active stays, new guest check-ins, and booking history',
      },
      billing: {
        title: 'Bill Calculator & Invoice',
        subtitle: 'Compute room stays, itemized extras, tax/GST, discounts, and check-out',
      },
      records: {
        title: 'Records & File Export',
        subtitle: 'Search finalized invoices and export/import CSV, JSON, or TXT reports',
      },
    };

    function renderMainOnly() {
      const main = document.getElementById('main-content');
      if (uiState.currentView === 'overview') {
        main.innerHTML = renderOverviewView();
      } else if (uiState.currentView === 'reservations') {
        main.innerHTML = renderReservationsView();
      } else if (uiState.currentView === 'billing') {
        main.innerHTML = renderBillingView();
      } else {
        main.innerHTML = renderRecordsView();
      }
      lucide.createIcons({ nodes: [main] });
    }

    function renderApp() {
      // Update header title & date
      const meta = VIEW_META[uiState.currentView] || VIEW_META.overview;
      document.getElementById('header-title').textContent = meta.title;
      document.getElementById('header-subtitle').textContent = meta.subtitle;
      document.getElementById('sidebar-brand-name').textContent = (appState.settings && appState.settings.hotelName) || 'Swiss Front-Desk';
      document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-GB', {
        weekday: 'short',
        day: '2-digit',
        month: 'short',
        year: 'numeric',
      });

      // Update sidebar badges
      document.getElementById('nav-empty-badge').textContent = appState.rooms.filter((r) => r.status === 'available').length;
      document.getElementById('nav-active-badge').textContent = appState.reservations.filter((r) => r.status === 'Checked-In').length;
      document.getElementById('nav-records-badge').textContent = appState.bills.length;

      // Update sidebar active link highlight
      document.querySelectorAll('.nav-item').forEach((btn) => {
        const isActive = btn.getAttribute('data-nav') === uiState.currentView;
        btn.classList.toggle('bg-blue-50', isActive);
        btn.classList.toggle('text-[#2563EB]', isActive);
        btn.classList.toggle('text-[#475569]', !isActive);
        btn.classList.toggle('hover:bg-slate-50', !isActive);
        btn.classList.toggle('hover:text-[#0F172A]', !isActive);
      });

      // Update currency toggle styling
      const inrBtn = document.getElementById('btn-currency-inr');
      const usdBtn = document.getElementById('btn-currency-usd');
      const isINR = appState.currency === 'INR';
      inrBtn.className = `cursor-pointer rounded-md py-1.5 text-xs font-semibold transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2563EB] ${
        isINR ? 'bg-[#FFFFFF] text-[#0F172A] shadow-sm' : 'text-[#475569] hover:text-[#0F172A]'
      }`;
      usdBtn.className = `cursor-pointer rounded-md py-1.5 text-xs font-semibold transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2563EB] ${
        !isINR ? 'bg-[#FFFFFF] text-[#0F172A] shadow-sm' : 'text-[#475569] hover:text-[#0F172A]'
      }`;

      renderMainOnly();
      lucide.createIcons();
    }

    // Boot application on load
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
